[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.setup]
description = "Install firmware Cargo helper tools."
command = "./tools/rust-env.sh"
args = [
    "cargo",
    "install",
    "flip-link",
    "cargo-binutils",
    "cargo-hex-to-uf2",
    "--locked",
]

[tasks.fmt]
description = "Check Rust formatting."
command = "./tools/rust-env.sh"
args = ["cargo", "fmt", "--check"]

[tasks.check]
description = "Check both firmware halves in release mode."
command = "./tools/rust-env.sh"
args = [
    "cargo",
    "check",
    "--release",
    "--bin",
    "central",
    "--bin",
    "peripheral",
]

[tasks.build]
description = "Build both firmware halves in release mode."
command = "./tools/rust-env.sh"
args = [
    "cargo",
    "build",
    "--release",
    "--bin",
    "central",
    "--bin",
    "peripheral",
]

[tasks.uf2]
description = "Build both halves and write dist/cornix-{left,right}.uf2."
dependencies = ["build"]
script_runner = "bash"
script = '''
set -euo pipefail
mkdir -p dist
./tools/rust-env.sh cargo objcopy --release --bin central -- -O ihex target/cornix-left.hex
./tools/rust-env.sh cargo objcopy --release --bin peripheral -- -O ihex target/cornix-right.hex
./tools/rust-env.sh cargo hex-to-uf2 --input-path target/cornix-left.hex --output-path dist/cornix-left.uf2 --family nrf52840
./tools/rust-env.sh cargo hex-to-uf2 --input-path target/cornix-right.hex --output-path dist/cornix-right.uf2 --family nrf52840
'''

[tasks.default]
alias = "uf2"
