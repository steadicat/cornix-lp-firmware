[keyboard]
name = "Cornix LP"
product_name = "Cornix LP"
vendor_id = 0xE118
product_id = 0x0001
manufacturer = "Jezail Funder"
serial_number = "vial:f64c2b3c:000001"
chip = "nrf52840"
usb_enable = true

[ble]
enabled = true
battery_adc_pin = "P0_05"
adc_divider_measured = 2000
adc_divider_total = 2806
charge_state.pin = "P0_01"
charge_state.low_active = true
default_tx_power = 8
ble_use_2m_phy = true

[host]
vial_enabled = true
unlock_keys = [[1, 3], [1, 4]]

[rmk]
ble_profiles_num = 3
split_peripherals_num = 1
split_central_sleep_timeout_seconds = 900
debounce_time = 3
combo_max_num = 32
fork_max_num = 16
morse_max_num = 32
max_patterns_per_key = 8
report_channel_size = 16
vial_channel_size = 4
flash_channel_size = 4

[dependency]
defmt_log = false

[chip.nrf52840]
dcdc_reg0 = true
dcdc_reg1 = true
dcdc_reg0_voltage = "3V3"

[split]
connection = "ble"

[split.central]
rows = 4
cols = 7
row_offset = 0
col_offset = 0
ble_addr = [0x10, 0x43, 0x6F, 0x72, 0x6E, 0xC1]

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_30", "P0_31", "P0_29", "P0_02"]
col_pins = ["P0_28", "P0_03", "P1_10", "P1_11", "P1_13", "P0_09", "P0_10"]
bootmagic = [1, 0]

[[split.central.input_device.encoder]]
pin_a = "P1_04"
pin_b = "P1_06"
internal_pullup = true
phase = "resolution"
resolution = 4
reverse = false

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 4
col_offset = 0
ble_addr = [0x11, 0x43, 0x6F, 0x72, 0x6E, 0xC2]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P1_09", "P0_28", "P0_03", "P1_10"]
col_pins = ["P0_30", "P0_31", "P0_29", "P0_02", "P1_13", "P0_10", "P0_09"]
bootmagic = [1, 0]

[[split.peripheral.input_device.encoder]]
pin_a = "P1_04"
pin_b = "P1_06"
internal_pullup = true
phase = "resolution"
resolution = 1
reverse = true

[layout]
rows = 8
cols = 7
layers = 10
matrix_map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,L)                    (4,5,R) (4,4,R) (4,3,R) (4,2,R) (4,1,R) (4,0,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,L)                    (5,5,R) (5,4,R) (5,3,R) (5,2,R) (5,1,R) (5,0,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,L) (2,6,L)  (5,6,R) (6,5,R) (6,4,R) (6,3,R) (6,2,R) (6,1,R) (6,0,R)
(3,0,L) (3,1,L) (3,2,L) (3,3,L) (3,4,L) (3,5,L)                    (7,5,R) (7,4,R) (7,3,R) (7,2,R) (7,1,R) (7,0,R)
"""

[[layer]]
name = "base"
keys = """
Escape  Q     W     E      R      T                Y      U          I       O     P          Backspace
Tab     A     S     D      F      G                H      J          K       L     Semicolon  Quote
LShift  Z     X     C      V      B     _    _     N      M          Comma   Dot   Slash      RShift
LCtrl   LGui  LAlt  MO(1)  Space  Enter            Enter  Backspace  MO(2)   RAlt  RGui       RCtrl
"""
encoders = [["AudioVolUp", "AudioVolDown"], ["PageDown", "PageUp"]]

[[layer]]
name = "lower"
keys = """
Grave  Kc1    Kc2    Kc3    Kc4    Kc5              Kc6   Kc7   Kc8   Kc9    Kc0   Delete
_      User0  User1  User2  User3  User4            Left  Down  Up    Right  _     _
_      _      _      _      _      _      _    _     _     _     _     _      _     _
_      _      _      _      _      _                _     _     _     _      _     _
"""
encoders = [["AudioVolUp", "AudioVolDown"], ["PageDown", "PageUp"]]

[[layer]]
name = "raise"
keys = """
F1          F2      F3     F4     F5     F6               F7    F8        F9      F10        F11  F12
User5      User6   User7  _      _      _                Home  PageDown  PageUp  End        _    _
Bootloader Reboot  _      _      _      _      _    _     _     _         _       _          _    _
_           _       _      _      _      _                _     _         _       ClearEeprom _    _
"""
encoders = [["AudioVolUp", "AudioVolDown"], ["PageDown", "PageUp"]]

[storage]
enabled = true
num_sectors = 32
start_addr = 0x000D4000
clear_storage = false
clear_layout = false

[behavior.one_shot]
timeout = "3s"

[behavior.combo]
timeout = "50ms"
combos = []

[behavior.morse]
enable_flow_tap = false
unilateral_tap = true
hold_on_other_press = true
hold_timeout = "250ms"
gap_timeout = "250ms"
